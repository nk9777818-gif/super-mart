
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPER MART Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#172554}
header{background:#101d40;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1000px;margin:auto;padding:18px}
.card{background:white;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin:8px 0}
button{padding:12px 16px;border:0;border-radius:8px;background:#172554;color:white;margin:5px}
.stat{display:inline-block;width:30%;vertical-align:top}
.hidden{display:none}
</style>
</head>
<body>
<header>
<div><b>SUPER MART</b><br><small>ADMIN CONTROL</small></div>
<button onclick="logout()">Logout</button>
</header>

<main>
<section id="login" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="message"></p>
</section>

<section id="dashboard" class="hidden">
<h2>Dashboard</h2>
<div class="card stat">Orders<h2 id="orders">0</h2></div>
<div class="card stat">Products<h2 id="products">0</h2></div>
<div class="card stat">Sales<h2 id="sales">₹0</h2></div>

<div class="card">
<h2>Order Management</h2>
<div id="orderList">Loading...</div>
</div>

<div class="card">
<h2>Product Management</h2>
<div id="productList">Loading...</div>
</div>
</section>
</main>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const db=createClient(
'https://kmyrqipubmwzvjokwmli.supabase.co',
'sb_publishable_K5g61U2Pr9iPyIxbcmyEvw_Dvysu-4O'
);

const $=id=>document.getElementById(id);

async function login(){
$('message').textContent='Checking...';
const {data,error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});
if(error){$('message').textContent=error.message;return;}
await checkAdmin(data.user.id);
}

async function checkAdmin(id){
const {data,error}=await db.from('profiles')
.select('role').eq('id',id).maybeSingle();

if(error||data?.role!=='admin'){
await db.auth.signOut();
$('message').textContent='Admin access denied';
return;
}
$('login').classList.add('hidden');
$('dashboard').classList.remove('hidden');
loadData();
}

async function loadData(){
const [o,p]=await Promise.all([
db.from('orders').select('*').order('created_at',{ascending:false}).limit(100),
db.from('products').select('*').order('id',{ascending:false}).limit(200)
]);

if(o.error||p.error){alert(o.error?.message||p.error?.message);return;}

$('orders').textContent=o.data.length;
$('products').textContent=p.data.length;

const sales=o.data.filter(x=>!['cancelled','canceled'].includes(String(x.status||'').toLowerCase()))
.reduce((s,x)=>s+Number(x.total_amount||x.total||0),0);

$('sales').textContent='₹'+sales.toLocaleString('en-IN');

$('orderList').innerHTML=o.data.map(x=>`
<div class="card">
<b>Order #${Number(x.id)}</b><br>
₹${Number(x.total_amount||x.total||0)}<br>
Status: ${escapeText(x.status||'Pending')}<br>
<button onclick="updateOrder(${Number(x.id)},'processing')">Processing</button>
<button onclick="updateOrder(${Number(x.id)},'shipped')">Shipped</button>
<button onclick="updateOrder(${Number(x.id)},'delivered')">Delivered</button>
</div>`).join('');

$('productList').innerHTML=p.data.map(x=>`
<div class="card">
<b>${escapeText(x.name)}</b><br>
₹${Number(x.price)||0} · Stock: ${x.stock??'—'}<br>
${x.active?'Active':'Inactive'}<br>
<button onclick="toggleProduct(${Number(x.id)},${!x.active})">
${x.active?'Deactivate':'Activate'}
</button>
</div>`).join('');
}

function escapeText(value){
return String(value??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));
}

window.updateOrder=async(id,status)=>{
const {error}=await db.from('orders').update({status}).eq('id',id);
if(error)alert(error.message);else loadData();
};

window.toggleProduct=async(id,active)=>{
const {error}=await db.from('products').update({active}).eq('id',id);
if(error)alert(error.message);else loadData();
};

window.logout=async()=>{
await db.auth.signOut();
location.reload();
};

db.auth.onAuthStateChange(async(event,session)=>{
if(event==='SIGNED_IN'&&session?.user)await checkAdmin(session.user.id);
});
</script>
</body>
</html>
